[project]
name = "mandapi-geo"
version = "0.1.0"
description = "MandAPI GEO - AI Search Visibility + SEO Content Intelligence (mercado brasileiro)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
crawl4ai = ["crawl4ai>=0.6"]
llm = ["openai>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
mandapi-geo = "mandapi_geo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mandapi_geo*"]