services:
  geo:
    build:
      context: .
    image: mandapi-geo:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    command:
      - python
      - -m
      - uvicorn
      - mandapi_geo.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips
      - "${FORWARDED_ALLOW_IPS:-}"
      - --no-access-log
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
